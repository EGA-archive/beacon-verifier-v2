{% load static %}
{% load socialaccount %}
<nav class="navbar navbar-expand-lg barrav"
     style="z-index: 2; height: 62px; background-color: #40946C;">

  <div class="container-fluid">

    <!-- Left side: logo -->
    <span class="navbar-text titulo d-flex align-items-center">
      <img src="{% static 'CRG_White.png' %}" alt="CRG"
           style="height: 32.8px; padding-left: 35px; padding-right: 20px;">
    </span>

    <!-- Brand / Title -->
    <a class="navbar-brand d-flex align-items-center" href="/">
      <span class="bi bi-patch-check fw-bold ms-2"
            style="color: white;">
        &nbsp; Beacon Verifier
      </span>
    </a>

    <!-- Toggle (for mobile) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarText" aria-controls="navbarText"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Right side links -->
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link text-white mt-2" href="https://beacon-documentation-demo.ega-archive.org">
            Beacon Documentation
          </a>
        </li>

        <li class="nav-item">

    {% if user.is_authenticated and not token_expired %}
    <li>
     <a class="nav-link text-white" href="{% url 'account_logout' %}"><div class="bi bi-person-fill-down login">Logout</div></a>
     </li>
     <li>
     <a class="nav-link text-white mt-2">Hello, {{user.email}}</a>
     </li>
    {% else %}
         <li>
     <a class="nav-link text-white" href="{% provider_login_url 'my-server' process='login' %}"><div class="bi bi-person-up login">Login</div></a>
        </li>
     {% endif %}


      </ul>
    </div>

  </div>
</nav>
