<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        // Does this cookie string begin with the name we want?
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

function groupErrorsByUrl(map_out) {
    const results = [];
    let currentUrl = null;

    map_out.forEach(item => {
        if (typeof item === 'string') {
            currentUrl = item;
            results.push({
                title: currentUrl,
                errors: []
            });
        } else if (item && item.errorMessage) {
            if (!currentUrl) {
                currentUrl = "No URL available";
                results.push({
                    title: currentUrl,
                    errors: []
                });
            }

            const path = item.received?.path || [];
            const value = item.received?.value;
            const formattedMessage = `${item.errorMessage} at path: ${path.join(' -> ')} (received value: ${JSON.stringify(value)})`;

            // **Store both message and raw error**
            const lastGroup = results[results.length - 1];
            lastGroup.errors.push({
                message: formattedMessage,
                raw: item
            });
        }
    });

    return results;
}

<script>
  function download(file, text) {

      //creating an invisible element

      let element = document.createElement('a');
      element.setAttribute('href',
          'data:text/plain;charset=utf-8, '
          + encodeURIComponent(text));
      element.setAttribute('download', file);
      document.body.appendChild(element);
      element.click();

      document.body.removeChild(element);
  }

  // Start file download.

  document.getElementById("downl")
      .addEventListener("click", function () {
        var nodes = document.getElementById("theresultscol").querySelectorAll("a");
        console.log(nodes)
        var list = [].slice.call(nodes);
        var innertext = list.map(function(e) { return e.innerText; }).join("\n");
          let filename = "verifier.txt";

          download(filename, innertext);
      }, false);
</script>

<script>
const selectboxBtn = document.getElementById("selectbox");
const clearboxBtn = document.getElementById("clearbox");

function getCheckboxes() {
    return document.querySelectorAll('input[type="checkbox"]:not(#id_test_mode)');
}

function setState(allChecked) {
    if (allChecked) {
        clearboxBtn.classList.remove("inactive");
        selectboxBtn.classList.add("inactive");
    } else {
        selectboxBtn.classList.remove("inactive");
        clearboxBtn.classList.add("inactive");
    }
}

function setAll(state) {
    getCheckboxes().forEach(cb => cb.checked = state);
    setState(state);
}

selectboxBtn.addEventListener("click", () => setAll(true));
clearboxBtn.addEventListener("click", () => setAll(false));

document.addEventListener("DOMContentLoaded", () => {
    const checkboxes = getCheckboxes();
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    setState(allChecked);
});
</script>
